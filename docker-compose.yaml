version: '3.8'

services:
  app:
    image: php:8.2-cli
    working_dir: /var/www/itcc_project_tracker
    volumes:
      - ./itcc_project_tracker:/var/www/itcc_project_tracker
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: >
      sh -c "apt-get update && apt-get install -y libpng-dev libonig-dev libxml2-dev zip unzip curl &&
             docker-php-ext-install pdo_mysql mbstring &&
             curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer &&
             composer install --no-interaction &&
             php artisan serve --host=0.0.0.0 --port=8000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: laravel_app
      DB_USERNAME: root
      DB_PASSWORD: secret

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: laravel_app
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata: